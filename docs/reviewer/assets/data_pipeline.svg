<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2006" viewBox="0 0 1200 2006" role="img" aria-labelledby="title description">
<title id="title">Data preparation: from annotated assembly video to aligned logs</title>
<desc id="description">The supplied model-score exports cover 117 IKEA ASM test recordings, chosen because the IKEA ASM authors provide classifier scores for the test recordings. This is not the full dataset or 117 distinct people. GT means ground truth, the reference activity labels. NA means No Annotation: frames not covered by an annotated activity, not necessarily an absence of movement. P3D is an existing video classifier evaluated by the IKEA ASM authors. The earlier IKEA_ASM_UncertainEventLogs repository converts released scores into uncertain-log observations: each maximal consecutive run of a single GT label forms one observation, with segment bounds and GT label. Each activity score is independently averaged across the frames of that run. An explicitly illustrative five-frame example shows GT A on frames 10 to 12 with mean scores A 0.6 and B 0.4, and GT B on frames 13 to 14 with mean scores A 0.3 and B 0.7. This artifact uses half-open intervals [10,13) and [13,15); the upstream CSV stores inclusive end frames. This evaluation reuses the GT-aligned arithmetic mean scores, without new training, inference or frame aggregation. It removes GT-NA segments and the NA candidate option, focusing the task on activity matching. Empty case 38 is excluded separately. Both logs contain 116 cases and 1856 observations. The uncertain log retains three original non-NA scores per observation, replacing the third candidate with GT only if GT is absent from the top three: 353 replacements and 5568 candidates, without renormalization.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8799AC"/></marker></defs>
<rect width="1200" height="2006" fill="#F7F9FC"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="54" font-size="34" fill="#172B42" font-weight="700" text-anchor="start">From assembly video to two aligned logs</text>
<text x="40" y="91" font-size="20" fill="#526579" font-weight="400" text-anchor="start">We use the IKEA ASM test set because its authors provide classifier scores for those recordings.</text>
<rect x="40" y="120" width="1120" height="121" rx="12" fill="#EAF0F8" stroke="#D3E0EF"/>
<text x="64" y="155" font-size="21" fill="#155E9A" font-weight="700" text-anchor="start">GT = ground truth: reference activity labels supplied with the recordings.</text>
<text x="64" y="187" font-size="21" fill="#172B42" font-weight="700" text-anchor="start">NA = No Annotation: frames not covered by an annotated activity interval.</text>
<text x="64" y="219" font-size="20" fill="#526579" font-weight="400" text-anchor="start">NA does not necessarily mean that the person is inactive or not moving.</text>
<rect x="40" y="270" width="350" height="330" rx="16" fill="white" stroke="#D7E1EB"/>
<rect x="60" y="292" width="5" height="25" rx="2" fill="#155E9A" stroke="#155E9A"/>
<text x="78" y="311" font-size="14" fill="#155E9A" font-weight="700" text-anchor="start">UPSTREAM TEST RECORDINGS</text>
<text x="64" y="354" font-size="25" fill="#172B42" font-weight="700" text-anchor="start">IKEA ASM TEST set</text>
<text x="64" y="391" font-size="18" fill="#526579" font-weight="400" text-anchor="start">117 test-recording cases.</text>
<text x="64" y="420" font-size="18" fill="#526579" font-weight="400" text-anchor="start">RGB videos of furniture assembly.</text>
<text x="64" y="449" font-size="18" fill="#526579" font-weight="400" text-anchor="start">We use this set because its</text>
<text x="64" y="478" font-size="18" fill="#526579" font-weight="400" text-anchor="start">classifier scores are provided</text>
<text x="64" y="507" font-size="18" fill="#526579" font-weight="400" text-anchor="start">by the IKEA ASM authors.</text>
<text x="64" y="568" font-size="18" fill="#155E9A" font-weight="700" text-anchor="start">Recordings, not individual people.</text>
<rect x="425" y="270" width="340" height="330" rx="16" fill="white" stroke="#D7E1EB"/>
<rect x="445" y="292" width="5" height="25" rx="2" fill="#155E9A" stroke="#155E9A"/>
<text x="463" y="311" font-size="14" fill="#155E9A" font-weight="700" text-anchor="start">MODEL SELECTION</text>
<text x="449" y="354" font-size="25" fill="#172B42" font-weight="700" text-anchor="start">Choose P3D</text>
<text x="449" y="391" font-size="18" fill="#526579" font-weight="400" text-anchor="start">An existing video classifier</text>
<text x="449" y="420" font-size="18" fill="#526579" font-weight="400" text-anchor="start">evaluated by IKEA ASM authors.</text>
<text x="449" y="475" font-size="35" fill="#155E9A" font-weight="700" text-anchor="start">66.52%</text>
<text x="449" y="512" font-size="18" fill="#526579" font-weight="400" text-anchor="start">183,638 / 276,058 non-NA frames</text>
<text x="449" y="539" font-size="18" fill="#526579" font-weight="400" text-anchor="start">Best among supplied outputs</text>
<text x="449" y="566" font-size="18" fill="#526579" font-weight="400" text-anchor="start">on non-NA frame accuracy.</text>
<rect x="800" y="270" width="360" height="330" rx="16" fill="white" stroke="#D7E1EB"/>
<rect x="820" y="292" width="5" height="25" rx="2" fill="#155E9A" stroke="#155E9A"/>
<text x="838" y="311" font-size="14" fill="#155E9A" font-weight="700" text-anchor="start">OUR EARLIER LOG REPOSITORY</text>
<text x="824" y="354" font-size="25" fill="#172B42" font-weight="700" text-anchor="start">Reuse segment means</text>
<text x="824" y="391" font-size="18" fill="#526579" font-weight="400" text-anchor="start">Converts released classifier scores</text>
<text x="824" y="420" font-size="18" fill="#526579" font-weight="400" text-anchor="start">into uncertain-log observations.</text>
<text x="824" y="449" font-size="18" fill="#526579" font-weight="400" text-anchor="start">This evaluation reuses its supplied</text>
<text x="824" y="478" font-size="18" fill="#526579" font-weight="400" text-anchor="start">GT-aligned segment means.</text>
<text x="824" y="531" font-size="18" fill="#155E9A" font-weight="700" text-anchor="start">Mean = average of frame scores.</text>
<text x="824" y="568" font-size="18" fill="#155E9A" font-weight="700" text-anchor="start">No new model or frame processing.</text>
<path d="M 395 440 L 420 440" fill="none" stroke="#8799AC" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 770 440 L 795 440" fill="none" stroke="#8799AC" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 980 608 L 980 635 L 600 635 L 600 662" fill="none" stroke="#8799AC" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="670" width="1120" height="560" rx="16" fill="white" stroke="#D7E1EB"/>
<rect x="60" y="692" width="5" height="25" rx="2" fill="#155E9A" stroke="#155E9A"/>
<text x="78" y="711" font-size="14" fill="#155E9A" font-weight="700" text-anchor="start">INSIDE THE EARLIER LOG REPOSITORY</text>
<text x="64" y="754" font-size="26" fill="#172B42" font-weight="700" text-anchor="start">One GT run → one observation; average each activity score</text>
<text x="64" y="786" font-size="19" fill="#526579" font-weight="400" text-anchor="start">Illustrative two-activity example, not real IKEA data: every frame has a GT label and model scores.</text>
<text x="112" y="831" font-size="19" fill="#526579" font-weight="700" text-anchor="middle">Frame</text>
<text x="213" y="831" font-size="19" fill="#526579" font-weight="700" text-anchor="middle">GT</text>
<text x="316" y="831" font-size="19" fill="#526579" font-weight="700" text-anchor="middle">Score A</text>
<text x="436" y="831" font-size="19" fill="#526579" font-weight="700" text-anchor="middle">Score B</text>
<rect x="64" y="844" width="430" height="120" rx="9" fill="#E8F0FA" stroke="#ABC4DF"/>
<rect x="64" y="975" width="430" height="82" rx="9" fill="#FFF1E6" stroke="#E6BF9F"/>
<text x="112" y="871" font-size="21" fill="#155E9A" font-weight="400" text-anchor="middle">10</text>
<text x="213" y="871" font-size="21" fill="#155E9A" font-weight="700" text-anchor="middle">A</text>
<text x="316" y="871" font-size="21" fill="#155E9A" font-weight="400" text-anchor="middle">0.6</text>
<text x="436" y="871" font-size="21" fill="#155E9A" font-weight="400" text-anchor="middle">0.4</text>
<text x="112" y="909" font-size="21" fill="#155E9A" font-weight="400" text-anchor="middle">11</text>
<text x="213" y="909" font-size="21" fill="#155E9A" font-weight="700" text-anchor="middle">A</text>
<text x="316" y="909" font-size="21" fill="#155E9A" font-weight="400" text-anchor="middle">0.9</text>
<text x="436" y="909" font-size="21" fill="#155E9A" font-weight="400" text-anchor="middle">0.1</text>
<text x="112" y="947" font-size="21" fill="#155E9A" font-weight="400" text-anchor="middle">12</text>
<text x="213" y="947" font-size="21" fill="#155E9A" font-weight="700" text-anchor="middle">A</text>
<text x="316" y="947" font-size="21" fill="#155E9A" font-weight="400" text-anchor="middle">0.3</text>
<text x="436" y="947" font-size="21" fill="#155E9A" font-weight="400" text-anchor="middle">0.7</text>
<text x="112" y="1004" font-size="21" fill="#A85317" font-weight="400" text-anchor="middle">13</text>
<text x="213" y="1004" font-size="21" fill="#A85317" font-weight="700" text-anchor="middle">B</text>
<text x="316" y="1004" font-size="21" fill="#A85317" font-weight="400" text-anchor="middle">0.2</text>
<text x="436" y="1004" font-size="21" fill="#A85317" font-weight="400" text-anchor="middle">0.8</text>
<text x="112" y="1042" font-size="21" fill="#A85317" font-weight="400" text-anchor="middle">14</text>
<text x="213" y="1042" font-size="21" fill="#A85317" font-weight="700" text-anchor="middle">B</text>
<text x="316" y="1042" font-size="21" fill="#A85317" font-weight="400" text-anchor="middle">0.4</text>
<text x="436" y="1042" font-size="21" fill="#A85317" font-weight="400" text-anchor="middle">0.6</text>
<text x="585" y="889" font-size="17" fill="#155E9A" font-weight="400" text-anchor="middle">mean per activity</text>
<path d="M 505 906 L 677 906" fill="none" stroke="#8799AC" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="585" y="1005" font-size="17" fill="#A85317" font-weight="400" text-anchor="middle">mean per activity</text>
<path d="M 505 1022 L 677 1022" fill="none" stroke="#8799AC" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="691" y="844" width="443" height="120" rx="9" fill="#E8F0FA" stroke="#ABC4DF"/>
<text x="711" y="875" font-size="23" fill="#155E9A" font-weight="700" text-anchor="start">Observation 1 · GT = A</text>
<text x="711" y="912" font-size="20" fill="#172B42" font-weight="400" text-anchor="start">[10, 13): start 10, end 13 exclusive</text>
<text x="711" y="946" font-size="21" fill="#155E9A" font-weight="700" text-anchor="start">Mean scores: A = 0.6; B = 0.4</text>
<rect x="691" y="976" width="443" height="110" rx="9" fill="#FFF1E6" stroke="#E6BF9F"/>
<text x="711" y="1007" font-size="23" fill="#A85317" font-weight="700" text-anchor="start">Observation 2 · GT = B</text>
<text x="711" y="1040" font-size="20" fill="#172B42" font-weight="400" text-anchor="start">[13, 15): start 13, end 15 exclusive</text>
<text x="711" y="1072" font-size="21" fill="#A85317" font-weight="700" text-anchor="start">Mean scores: A = 0.3; B = 0.7</text>
<text x="64" y="1100" font-size="19" fill="#526579" font-weight="400" text-anchor="start">Example: mean(A) for observation 1 = (0.6 + 0.9 + 0.3) / 3 = 0.6; mean(B) = 0.4.</text>
<text x="64" y="1138" font-size="19" fill="#172B42" font-weight="400" text-anchor="start">Within each case, a maximal consecutive same-GT run forms one observation (event). GT changes start a new run.</text>
<text x="64" y="1173" font-size="19" fill="#526579" font-weight="400" text-anchor="start">Bounds here are half-open [start, end); the upstream CSV uses inclusive end frames.</text>
<text x="64" y="1208" font-size="20" fill="#155E9A" font-weight="700" text-anchor="start">Matching uses the precomputed export; this evaluation does not redo the frame averaging.</text>
<path d="M 600 1238 L 600 1258" fill="none" stroke="#8799AC" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g transform="translate(0 596)">
<rect x="40" y="670" width="1120" height="170" rx="16" fill="white" stroke="#D7E1EB"/>
<rect x="60" y="692" width="5" height="25" rx="2" fill="#146C61" stroke="#146C61"/>
<text x="78" y="711" font-size="14" fill="#146C61" font-weight="700" text-anchor="start">COHORT AND SEGMENT FILTERING</text>
<text x="64" y="754" font-size="25" fill="#172B42" font-weight="700" text-anchor="start">Remove GT-NA segments and the NA candidate option</text>
<text x="64" y="784" font-size="21" fill="#526579" font-weight="400" text-anchor="start">Focus on matching annotated activities; unannotated intervals are outside this task.</text>
<text x="64" y="817" font-size="20" fill="#526579" font-weight="400" text-anchor="start">817 NA segments removed within the 116 retained cases; empty case 38 is excluded separately.</text>
<path d="M 600 847 L 600 870 L 310 870 L 310 897" fill="none" stroke="#8799AC" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 600 870 L 890 870 L 890 897" fill="none" stroke="#8799AC" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="413" y="856" width="374" height="34" rx="7" fill="#F7F9FC" stroke="#F7F9FC"/>
<text x="600" y="879" font-size="17" fill="#526579" font-weight="400" text-anchor="middle">Aligned case IDs and segment boundaries</text>
<rect x="40" y="905" width="540" height="305" rx="16" fill="white" stroke="#D7E1EB"/>
<rect x="60" y="927" width="5" height="25" rx="2" fill="#146C61" stroke="#146C61"/>
<text x="78" y="946" font-size="14" fill="#146C61" font-weight="700" text-anchor="start">CERTAIN REPRESENTATION</text>
<text x="64" y="989" font-size="25" fill="#172B42" font-weight="700" text-anchor="start">Ground-truth log</text>
<text x="64" y="1026" font-size="21" fill="#526579" font-weight="400" text-anchor="start">One annotated activity per observation.</text>
<text x="64" y="1060" font-size="21" fill="#526579" font-weight="400" text-anchor="start">116 cases and 1,856 observations.</text>
<text x="64" y="1094" font-size="21" fill="#526579" font-weight="400" text-anchor="start">The GT trace supplies rule-mining input.</text>
<rect x="64" y="1123" width="490" height="58" rx="10" fill="#ECF5F2" stroke="#CDE5DD"/>
<text x="84" y="1159" font-size="19" fill="#146C61" font-weight="700" text-anchor="start">Keep the original segment boundaries.</text>
<rect x="620" y="905" width="540" height="305" rx="16" fill="white" stroke="#D7E1EB"/>
<rect x="640" y="927" width="5" height="25" rx="2" fill="#A85317" stroke="#A85317"/>
<text x="658" y="946" font-size="14" fill="#A85317" font-weight="700" text-anchor="start">UNCERTAIN REPRESENTATION</text>
<text x="644" y="989" font-size="23" fill="#172B42" font-weight="700" text-anchor="start">Three candidates per observation</text>
<text x="644" y="1026" font-size="19" fill="#526579" font-weight="400" text-anchor="start">1. Rank non-NA activities by original score.</text>
<text x="644" y="1055" font-size="19" fill="#526579" font-weight="400" text-anchor="start">2. Keep the three highest-scoring labels.</text>
<text x="644" y="1084" font-size="19" fill="#526579" font-weight="400" text-anchor="start">3. If GT is absent, replace only the third</text>
<text x="644" y="1113" font-size="19" fill="#526579" font-weight="400" text-anchor="start">    label with GT and its original score.</text>
<rect x="644" y="1150" width="490" height="39" rx="10" fill="#FFF2E8" stroke="#F0D9C6"/>
<text x="661" y="1176" font-size="19" fill="#A85317" font-weight="700" text-anchor="start">353 replacements · no renormalization</text>
<rect x="40" y="1234" width="1120" height="66" rx="12" fill="#EAF0F8" stroke="#D3E0EF"/>
<text x="600" y="1263" font-size="23" fill="#155E9A" font-weight="700" text-anchor="middle">116 cases  ·  1,856 observations  ·  5,568 candidate variables</text>
<text x="600" y="1287" font-size="17" fill="#526579" font-weight="400" text-anchor="middle">GT assistance makes this a controlled experiment, not held-out recognition evaluation.</text>
<text x="40" y="1336" font-size="18" fill="#526579" font-weight="400" text-anchor="start">Data and classifier context: Ben-Shabat et al. (2021), IKEA ASM.</text>
<text x="40" y="1365" font-size="18" fill="#526579" font-weight="400" text-anchor="start">Log conversion and supplied segment means: IKEA_ASM_UncertainEventLogs (pinned earlier repository).</text>
</g>
</g>
